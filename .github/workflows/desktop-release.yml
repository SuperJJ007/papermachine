# Build the PaperMachine desktop installers for both shipped platforms and
# collect them into one draft GitHub release.
#
# Manual-only. A draft release is invisible outside the repository's writers and
# does not create its tag until someone publishes it, so a dispatched run can be
# inspected, downloaded, and thrown away without leaving a public trace — which
# is the whole point while the Windows build has no device acceptance behind it.
#
# No paid signing identity is configured: the macOS package is ad-hoc signed
# (Gatekeeper still shows the warning the README documents), and the Windows
# installer is unsigned and experimental/beta (SmartScreen warns). Paid
# signing is a separate change that needs certificates in repository secrets.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag the draft release is created for (created only when the release is published)
        required: true
        default: papermachine-v0.1.0

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # A packaging run must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'
  # The repository-wide `tsc -b tsconfig.host.json` inside `pnpm -w run build`
  # exhausts the default heap on a hosted macOS runner (7 GB machine, so Node
  # sizes old-space at roughly half of it) and aborts with an OOM before
  # Electron Builder is ever reached.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  macos:
    runs-on: macos-14
    name: macOS installers (arm64 + x64)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # --os/--cpu/--libc widen this one install call to fetch every desktop
      # packaging target's sharp/koffi native module variant (see
      # pnpm-workspace.yaml and apps/desktop/README.md), not just this
      # runner's own platform. `stage:host` (invoked by the Package step
      # below) asserts all three desktop targets' variants are present
      # regardless of which target electron-builder packages in this job.
      - name: Install (immutable, every desktop packaging target's native module variant)
        run: pnpm install --frozen-lockfile --os=darwin --os=win32 --os=linux --cpu=x64 --cpu=arm64 --libc=glibc

      - name: Package
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:mac

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/desktop-update.darwin.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    name: Windows installer (x64)
    # Git Bash so the `run:` blocks below are one shell language across both
    # jobs. The packaging script itself is shell-independent: pnpm runs it
    # through cmd.exe here whatever this setting says.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # --os/--cpu/--libc widen this one install call to fetch every desktop
      # packaging target's sharp/koffi native module variant (see
      # pnpm-workspace.yaml and apps/desktop/README.md), not just this
      # runner's own platform. `stage:host` (invoked by the Package step
      # below) asserts all three desktop targets' variants are present
      # regardless of which target electron-builder packages in this job.
      - name: Install (immutable, every desktop packaging target's native module variant)
        run: pnpm install --frozen-lockfile --os=darwin --os=win32 --os=linux --cpu=x64 --cpu=arm64 --libc=glibc

      # The only Windows execution this repository can reach without a Windows
      # device: the carrier's own unit tests decide platform-dependent paths at
      # import time, so they cover the Windows branches only when run here.
      - name: Carrier tests
        run: pnpm vitest run --root . apps/desktop/tests

      # Proves the pinned win-64 asset is an executable image of the right
      # architecture before a packaging run buries it inside the installer.
      - name: Bundled micromamba runs
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop run fetch:micromamba win32-x64
          ./apps/desktop/resources/bin/win32-x64/micromamba.exe --version

      # This runner's own System32 already carries the MSVC CRT, so the
      # `--version` run above passing proves nothing about the app-local DLLs
      # a bare end-user machine actually needs (see the accompanying Agent
      # Note) — only a file-presence check catches a fetch that silently
      # stopped landing them. This checks the source tree `fetch:micromamba`
      # wrote into, before the slower Package step runs; it does not prove
      # electron-builder actually copied these files into the packaged
      # output — `after-pack.mjs`'s `assertBundledRuntimePresent` is the
      # gate that checks the packaged `release/win-unpacked/resources/bin`
      # itself, and runs inside the Package step below on every packaging
      # invocation, not only in this workflow.
      - name: App-local CRT DLLs fetched (source tree, pre-package)
        run: |
          mapfile -t files < <(jq -r '.["win32-x64"].runtime.files[]' apps/desktop/resources/micromamba.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "desktop CI: no runtime.files pinned for win32-x64 in resources/micromamba.json" >&2
            exit 1
          fi
          for name in "${files[@]}"; do
            if [ ! -f "apps/desktop/resources/bin/win32-x64/$name" ]; then
              echo "desktop CI: missing app-local CRT DLL: $name" >&2
              exit 1
            fi
          done
          echo "app-local CRT DLLs present: ${files[*]}"

      - name: Package
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/desktop-update.win32.json
          if-no-files-found: error

  draft:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    name: Collect into a draft release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      # A re-run replaces its own draft rather than appending a second set of
      # installers to it. A published release under the same tag is never
      # touched: this workflow only ever produces drafts, so finding one means
      # the dispatched tag names a real release and the run stops.
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            true) gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes ;;
            false) echo "::error::$TAG already has a published release" >&2 ; exit 1 ;;
          esac
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "PaperMachine $TAG" \
            --notes "No paid signing identity: the macOS package is ad-hoc signed, the Windows installer is unsigned and experimental/beta. Built by the Desktop release workflow from $GITHUB_SHA."
