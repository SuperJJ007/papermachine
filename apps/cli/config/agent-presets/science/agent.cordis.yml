# The `science` agent preset: a restricted agent for reproducible Python/R
# analysis, read-only over the workspace, with durable Science state.
#
# It composes the `@deepseek-ai/dsh-tool-science` Consumer (run_python, run_r,
# get_science_state, annotate_artifact, install_science_packages) plus a narrow supporting
# roster: discovery and reading of the workspace, skills, the generic
# ask-user/todo tools, Web search and fetch, plan mode, and a restricted
# subagent. It carries no shell and no filesystem write or edit — a
# capability this preset lacks is a separate product decision, not a YAML
# edit. The subagent it does compose is deliberately narrower than its own:
# see the `delegation` group below and
# `.agents/notes/implemented/feature/2026-09-02-science-restricted-subagent.md`.
#
# TRUST: `run_python`/`run_r` execute real code through the Host-owned Science
# Runtime (`ctx.scienceRuntime`), confined to whatever existing Conda prefix
# the deployment's `science` Runtime profile allowlists. A deployment with no
# such profile still lists and can select this preset; the first real Science
# request then fails loudly, naming the missing Host service or profile,
# before any provider call — see `@deepseek-ai/dsh-agent-presets` (this file)
# and `@deepseek-ai/dsh-science-runtime` (the Host-owned execution).
#
# This file is an AGENT-PLANE composition. The preset registry mounts it once
# under a standing scope; only agents that join the `science` preset inherit
# its tools and prompt sections. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, the model route, and the Science
# Runtime row a usable deployment mounts separately.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a Science agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}, mounted read-only.

      You run reproducible Python and R analyses through `run_python` and `run_r`. Read, search, and inspect the workspace with `read`, `glob`, and `grep`; you cannot create, edit, or delete files. Load a data file (csv, tsv, xlsx, parquet, sav, dta, rds, json data) through `run_python` or `run_r` instead, even for a first look at its columns or shape — `read`, `glob`, and `grep` are for code, text, and documents, not tabular data. Call `get_science_state` to recover durable Science identity, environment, and recent-run history rather than assuming it from earlier turns.

      Use `web_search` and `web_fetch` for general reference: method background, dataset documentation, and package/API usage. When a paper-lookup tool is available (named `mcp__papers__*` or `mcp__arxiv__*`), prefer it over `web_search` for literature search, citation lookup, or a paper's full text. Name the source URL or citation for anything a web or paper tool returns before you rely on it in an analysis.

      Delegate to `subagent` for a genuinely independent sub-task: parallel work that does not depend on your own in-progress state (for example, literature search running alongside data exploration) or a single exploratory analysis long enough to run on its own while you continue elsewhere. The child starts its own kernel with none of your variables loaded — do not delegate a step that depends on data or results already sitting in your kernel unless the sub-task first reproduces them itself. Treat what a subagent reports back as a claim to verify, not a settled fact: recheck the key numbers before you act on them or repeat them to the user.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── science ─────────────────────────────────────────────────────────────────

# The model-facing Science Consumer: durable mode/environment binding,
# `science:environment` runtime context, all five Science tools
# (run_python, run_r, get_science_state, annotate_artifact,
# install_science_packages).
# The viewer-edit Remote is a Host-owned Web row because the Typert Gateway
# resolves services from the Host root; this preset contributes no service.
# These values are explicit preset policy — not package defaults, not
# environment discovery — and changing any of them changes model-visible
# output.
- id: tool-science
  name: '@deepseek-ai/dsh-tool-science'
  config:
    profileId: science
    modeRevision: science-v1
    stateHistoryLimit: 8

# ── filesystem ──────────────────────────────────────────────────────────────

# The read-only subpath entry: `read` and conditional `read_image`, never
# `write` or `edit`. It shares the root `@deepseek-ai/dsh-tool-fs` package's
# `Config` and read-capability resolution, so the `fs` service and its policy
# stay host-owned exactly as they do for `standard`.
- id: tool-fs-read-only
  name: '@deepseek-ai/dsh-tool-fs/read-only'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime, same as `standard`.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              For Science work specifically, treat any analysis of three or more steps, or any pipeline that cleans data, fits or evaluates a model, and produces a chart, as requiring a plan: design the complete pipeline before the first run_python/run_r call.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. The token meter stays on
# the HOST plane and is resolved through it, same as `standard`.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web ─────────────────────────────────────────────────────────────────────

# The `web` service and its search/fetch providers stay in the host
# composition; only the model-facing tool is per-session. Unlike `standard`,
# this preset enables `web_fetch`: `run_python`/`run_r` already reach the
# network directly, so `web_fetch` adds no exposure this agent lacked already.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── delegation ──────────────────────────────────────────────────────────────

# A deliberately RESTRICTED subagent — a first cut, not Science's Specialists
# design. `composeFrom()` joins a spawned child to this same standing
# composition (`packages/preset/agent-presets/README.md#composing-a-child-agent`),
# so left alone the child would see every tool this preset registers,
# including its own `subagent` row. `toolFilter.deny` below is what actually
# draws Science's boundary around the child: no shell (never composed by this
# preset in the first place), no write/edit (same), no package installs, and
# no further delegation or child-messaging/listing tools. `maxDepth: 1` caps
# the child's own delegation depth at 1, so an attempted grandchild is
# rejected by the depth check even before `toolFilter` removes its tool.
# `persona` shadows this preset's persona for the child alone, stating its own
# narrower rules (own kernel, read-only workspace, no installs, report back)
# because the parent's persona above describes THIS agent, not the child's.
#
# The `subagents` registry and its `spawn` backend live in the HOST
# composition (`packages/bundle/base/cordis.patch.yml`), same as `standard`;
# this preset contributes only the delegation TOOLS below, which resolve that
# host registry. Unlike `standard`'s `delegation` group, this one carries no
# `isolate: workflowEngine` — that realm exists only for the
# workflow-worker-thread/tool-workflow/tool-ralph rows this preset does not
# compose, and none of the rows below publish a service of their own.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 1
        persona: |-
          You are a PaperMachine Science subagent, spawned by a parent Science agent to do exactly the one task named in your prompt. Do only that task; when it is done, call `report` and stop — do not keep exploring past what you were asked.

          You run in your own kernel, independent of the parent's: no variables, imports, or loaded data carry over. Do not assume anything the parent mentioned is already available to you — read or recompute any data you need yourself with `run_python`/`run_r`.

          Your workspace is read-only: you cannot create, edit, or delete files. You cannot install or persist packages — there is no `install_science_packages` here, and an in-kernel `pip install`/`install.packages()` lasts only until this kernel restarts.

          When you call `report`, state your conclusion, the key numbers, and the `logical_name` of every artifact you produced. If something is uncertain, say so in the report instead of guessing.
        toolFilter:
          deny:
            - install_science_packages
            - subagent
            - send_message
            - interrupt_agent
            - list_agents
            - exit_plan_mode
            - ask_user_question

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
