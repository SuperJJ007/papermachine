# Record through science-headless with an isolated PAPERMACHINE_HOME outside
# generic sandbox temp roots and an existing, allowlisted Python Conda prefix.
- id: science-runtime
  config:
    profiles:
      science:
        pythonPrefix: !!js process.env.DSH_SCIENCE_TEST_PYTHON_PREFIX
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: session-title-llm
  disabled: true
