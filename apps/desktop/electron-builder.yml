appId: com.papermachine.desktop
productName: PaperMachine
asar: true
# The Host and the watchdog both re-enter this same Electron binary as plain
# Node (`ELECTRON_RUN_AS_NODE=1`, src/main.ts), so the packaged app must keep
# that fuse open. Electron's default is tightening; declaring it here pins the
# behaviour the process model depends on instead of inheriting it.
electronFuses:
  runAsNode: true
  # `@electron/fuses` flips fuse bits by rewriting
  # `Contents/Frameworks/Electron Framework.framework/…/Electron Framework`
  # in place, and electron-builder runs that flip *after* the
  # `scripts/sign-mac-app.mjs` afterPack signature (app-builder-lib
  # 26.15.3's `platformPackager.js` calls `doAddElectronFuses` right before
  # its own `doSignAfterPack`, itself skipped by `mac.identity: null`
  # below) — so a fuse flip that changes any byte can invalidate that
  # earlier signature. This option makes `@electron/fuses` re-run
  # `codesign --sign - --force --preserve-metadata=… --deep` on the `.app`
  # immediately after flipping (without a verify step of its own), so the
  # signature the DMG ships always postdates the fuse write. The afterPack
  # sign+verify in `scripts/sign-mac-app.mjs` stays: this later resign
  # carries no verification of its own, so it cannot replace that check.
  resetAdHocDarwinSignature: true
afterPack: ./scripts/after-pack.mjs
artifactBuildStarted: ./scripts/assert-native-installer.mjs
directories:
  output: release
files:
  - lib/*.js
  - lib/*.cjs
  - package.json
extraResources:
  - from: resources/environments
    to: environments
  - from: resources/onboarding.html
    to: onboarding.html
  - from: resources/telemetry.json
    to: telemetry.json
  - from: resources/host.json
    to: host.json
  - from: resources/skills
    to: skills
  # `node_modules` is copied by scripts/after-pack.mjs: electron-builder drops
  # it from this entry no matter the filter.
  - from: .stage/host
    to: host
mac:
  category: public.app-category.education
  # No Apple Developer ID is configured (a separate, undecided business
  # decision) and none should be picked up by accident: a real identity
  # found in a build machine's keychain without the notarization this
  # repository does not run would sign the app in a way Gatekeeper trusts
  # even less than the ad-hoc signature `scripts/sign-mac-app.mjs` applies
  # in `afterPack` — signed-but-not-notarized is its own distinct Gatekeeper
  # rejection. `identity: null` makes electron-builder skip its own signing
  # step unconditionally instead of probing the keychain for one.
  identity: null
  # Only this platform's own `resources/bin/darwin-${arch}` (never the other
  # architecture's, nor win32's) — a bare `resources/bin` here previously
  # staged every platform's binaries into every build. `to:` keeps the
  # `bin/<platform>-<arch>` layout `src/main.ts`'s `micromambaPath()` looks
  # under; `${arch}` expands per architecture build (verified against
  # app-builder-lib 26.15.3's `macroExpander.js`/`fileMatcher.js`: both
  # `from` and `to` are macro-expanded, and a platform's `extraResources`
  # merges with, rather than replaces, the top-level list above).
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin/darwin-${arch}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  artifactName: PaperMachine-${version}-${arch}.${ext}
win:
  # Only this platform's own `resources/bin/win32-${arch}`; see the `mac`
  # section above for why a platform-scoped entry replaces the removed
  # top-level `resources/bin` one.
  extraResources:
    - from: resources/bin/win32-${arch}
      to: bin/win32-${arch}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: PaperMachine-${version}-${arch}.${ext}
  # Per-user install under %LOCALAPPDATA%: an unsigned per-machine installer
  # adds a UAC prompt on top of the SmartScreen warning, and the app writes
  # only under the user's home in any case.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
