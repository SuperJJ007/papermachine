<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up DeepSeek Science</title>
<style>
  :root{font:16px system-ui;color:#17212b;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(680px,calc(100vw - 40px));background:white;border:1px solid #dce3ea;border-radius:18px;padding:36px;box-shadow:0 18px 60px #1d344515}h1{margin:0 0 8px;font-size:28px}p{color:#596875;line-height:1.5}.choices{display:grid;gap:12px;margin:28px 0}.choice{display:flex;gap:14px;padding:18px;border:1px solid #d8e0e8;border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:#1769aa;background:#f2f8fd}.choice input{margin-top:4px}.choice span{display:grid;gap:5px}.choice small{color:#687783}#guidance{margin:28px 0;padding:18px;border:1px dashed #c7d2db;border-radius:12px;background:#f8fafc}#guidance p{margin:0 0 8px}#guidance p:last-child{margin-bottom:0}.actions{display:flex;gap:10px;align-items:center}button{border:0;border-radius:9px;padding:11px 18px;font:inherit;cursor:pointer}#bind{background:#1769aa;color:white}#bind:disabled{opacity:.45;cursor:default}#redetect{background:#e8edf2;color:#273542}
</style>
<main>
  <h1>Set up your Science workspace</h1>
  <p>检测到的环境 · DeepSeek Science binds an existing Python/R environment on this machine — no download required.</p>
  <div id="choices" class="choices" hidden></div>
  <div id="guidance" hidden>
    <p>未检测到可用环境 · No usable environment was detected.</p>
    <p>请先安装 Anaconda (anaconda.com)，然后点击“重新检测”。<br>Install Anaconda from anaconda.com, then click Re-detect.</p>
  </div>
  <div class="actions"><button id="bind" disabled>绑定并继续 · Bind and continue</button><button id="redetect">重新检测 · Re-detect</button></div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module">{{ONBOARDING_SCRIPT}}</script>
</html>
