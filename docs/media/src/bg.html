<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#07101d;}
  #stage{position:relative;width:1280px;height:640px;overflow:hidden;background:
    radial-gradient(90% 95% at 74% 26%, #2f63a6 0%, #1d4577 28%, #12294b 54%, #0a1729 78%, #070f1b 100%);}
  .ribbons{position:absolute;inset:-16%;filter:blur(46px);}
  .darks{position:absolute;inset:-16%;filter:blur(76px);}
  .grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:104px 104px;}
  .left{position:absolute;inset:0;background:linear-gradient(90deg, rgba(5,11,21,.82) 0%, rgba(5,11,21,.55) 26%, rgba(5,11,21,0) 52%);}
  .vig{position:absolute;inset:0;background:
    radial-gradient(110% 82% at 60% 34%, rgba(0,0,0,0) 36%, rgba(4,9,17,.55) 80%, rgba(3,7,14,.84) 100%);}
</style></head><body><div id="stage">
  <svg class="darks" viewBox="0 0 1280 640" preserveAspectRatio="none">
    <ellipse cx="1180" cy="600" rx="420" ry="220" fill="#07101e" opacity=".8"/>
    <ellipse cx="180" cy="560" rx="360" ry="220" fill="#060e19" opacity=".85"/>
    <ellipse cx="60" cy="80" rx="320" ry="170" fill="#070f1c" opacity=".7"/>
    <ellipse cx="700" cy="360" rx="220" ry="80" fill="#0e2745" opacity=".45"/>
  </svg>
  <svg class="ribbons" viewBox="0 0 1280 640" preserveAspectRatio="none">
    <defs>
      <linearGradient id="r1" x1=".05" y1="0" x2=".95" y2=".25">
        <stop offset="0" stop-color="#eef4ff" stop-opacity="0"/>
        <stop offset=".30" stop-color="#eef4ff" stop-opacity=".34"/>
        <stop offset=".62" stop-color="#f4f8ff" stop-opacity=".80"/>
        <stop offset=".88" stop-color="#d5e4f8" stop-opacity=".34"/>
        <stop offset="1" stop-color="#d5e4f8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="r2" x1=".2" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#dfeafa" stop-opacity="0"/>
        <stop offset=".42" stop-color="#eef4ff" stop-opacity=".48"/>
        <stop offset=".78" stop-color="#b8d1ef" stop-opacity=".22"/>
        <stop offset="1" stop-color="#b8d1ef" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="r3" x1="1" y1="0" x2=".3" y2="1">
        <stop offset="0" stop-color="#cfe1f7" stop-opacity="0"/>
        <stop offset=".5" stop-color="#e8f1ff" stop-opacity=".40"/>
        <stop offset="1" stop-color="#9fc0e8" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M120 176 C 330 74, 520 232, 740 158 S 1060 26, 1300 104 L 1430 84 L 1430 232 C 1250 268, 1080 206, 880 240 S 470 330, 240 288 S 60 256, 60 262 Z" fill="url(#r1)"/>
    <path d="M240 470 C 430 392, 620 502, 830 456 S 1160 336, 1400 404 L 1430 396 L 1430 512 C 1140 502, 920 578, 640 560 S 300 596, 200 556 Z" fill="url(#r2)"/>
    <path d="M660 -80 C 800 60, 700 206, 856 292 S 1120 372, 1240 508 L 1290 700 L 1090 700 C 1000 536, 820 468, 720 330 S 520 96, 520 -80 Z" fill="url(#r3)" opacity=".7"/>
    <path d="M880 76 C 1000 44, 1120 108, 1260 74 L 1430 34 L 1430 138 C 1260 176, 1100 138, 980 162 S 830 176, 800 156 Z" fill="url(#r1)" opacity=".5"/>
  </svg>
  <svg class="grain" viewBox="0 0 1280 640" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="1280" height="640" filter="url(#n)"/></svg>
  <div class="grid"></div><div class="left"></div><div class="vig"></div>
</div></body></html>
