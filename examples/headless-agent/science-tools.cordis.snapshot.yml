# Keyless runnable composition for the model-visible Science tool surface.
# Real `dsh-subprocess-local`/`dsh-sandbox-local` providers (the fake
# sandbox runner below is a no-policy passthrough, and the fake Conda prefix
# forwards a kernel launch to a fake driver — see `prepareScienceFixture` in
# `tests/headless.snapshot.ts`) preserve the real Loader, agent-loop, Science
# Runtime persistent-kernel pipeline, tool runtime, and durable Session path.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents: []
          workspaceContext: false
          skills:
            enabled: false
          toolBash: false
          toolJobs: false
          persona: Science snapshot fixture.
      - insert:
          - id: tool-fs-read-only
            name: '@deepseek-ai/dsh-tool-fs/read-only'
          # Science Runtime confinement requires a sandbox; base mounts none
          # (bash-local/tool-fs need only `subprocess`). This inline
          # passthrough runner (the same technique `examples/acp-agent`'s
          # own snapshots use) reports "full" enforcement without real OS
          # sandboxing.
          - id: sandbox
            name: '@deepseek-ai/dsh-sandbox-local'
            config:
              runnerCommand:
                - bash
                - -c
                - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
                - passthrough-runner
              runnerFailureSignatures:
                - 'passthrough-runner: profile rejected'
          # Auto-capture persists each run-written file's bytes before its
          # durable event, so the Science Runtime waits for an attachment
          # store; this snapshot roots one beside the Runtime's own private home.
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
            config:
              dshHome: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/dsh-home'"
          - id: science-session
            name: '@deepseek-ai/dsh-science-session'
          - id: science-session-invariant
            name: '@deepseek-ai/dsh-science-session/invariant'
          - id: science-runtime
            name: '@deepseek-ai/dsh-science-runtime'
            config:
              dshHome: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/dsh-home'"
              profiles:
                fake:
                  pythonPrefix: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/fake-conda'"
          - id: science-runtime-invariant
            name: '@deepseek-ai/dsh-science-runtime/invariant'
          - id: science-edit-service
            name: '@deepseek-ai/dsh-tool-science/edit-service'
          - id: tool-science
            name: '@deepseek-ai/dsh-tool-science'
            config:
              profileId: fake
              modeRevision: snapshot-r3
              stateHistoryLimit: 2
          - id: tool-science-invariant
            name: '@deepseek-ai/dsh-tool-science/invariant'
          - id: science-mock-llm
            name: ./tests/fixtures/science-mock-llm.ts
