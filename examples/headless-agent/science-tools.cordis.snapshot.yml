# Keyless runnable composition for the model-visible Science tool surface.
# Deterministic subprocess and sandbox fixture providers preserve the real
# Loader, agent-loop, Science Runtime, tool runtime, and durable Session path.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: subprocess
        name: '@deepseek-ai/dsh-subprocess-local'
        disabled: true
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents: []
          workspaceContext: false
          skills:
            enabled: false
          toolBash: false
          toolJobs: false
          persona: Science snapshot fixture.
      - insert:
          - id: tool-fs-read-only
            name: '@deepseek-ai/dsh-tool-fs/read-only'
          # Auto-capture persists each run-written file's bytes before its
          # durable event, so the Science Runtime waits for an attachment
          # store; this snapshot roots one beside the Runtime's own private home.
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
            config:
              dshHome: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/dsh-home'"
          - id: science-fixture-runtime
            name: ./tests/fixtures/science-runtime-fixture.ts
          - id: science-session
            name: '@deepseek-ai/dsh-science-session'
          - id: science-session-invariant
            name: '@deepseek-ai/dsh-science-session/invariant'
          - id: science-runtime
            name: '@deepseek-ai/dsh-science-runtime'
            config:
              dshHome: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/dsh-home'"
              profiles:
                fake:
                  pythonPrefix: !!js "process.env.DSH_SCIENCE_SNAPSHOT_ROOT + '/fake-conda'"
          - id: science-runtime-invariant
            name: '@deepseek-ai/dsh-science-runtime/invariant'
          - id: tool-science
            name: '@deepseek-ai/dsh-tool-science'
            config:
              profileId: fake
              modeRevision: snapshot-r3
              stateHistoryLimit: 2
          - id: tool-science-invariant
            name: '@deepseek-ai/dsh-tool-science/invariant'
          - id: science-mock-llm
            name: ./tests/fixtures/science-mock-llm.ts
