# Record through science-headless with an isolated PAPERMACHINE_HOME outside
# generic sandbox temp roots and an existing, allowlisted Python Conda prefix.
- id: science-runtime
  config:
    profiles:
      science:
        pythonPrefix: !!js process.env.DSH_SCIENCE_TEST_PYTHON_PREFIX
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: session-title-llm
  disabled: true

- id: llm-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
